<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGOC Web — Gestión de Obras</title>
    <link rel="stylesheet" th:href="@{/css/sigoc.css}" href="/css/sigoc.css">
</head>
<body th:data-username="${username}"
      th:data-nombre="${nombreCompleto}"
      th:data-rol="${rol}"
      th:data-rol-etiqueta="${rolEtiqueta}"
      th:data-cambio-clave="${requiereCambioClave}">

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>SIGOC Web</h2>
            <small>Control de Obras Civiles</small>
        </div>
        <nav id="sidebarNav" class="sidebar-nav"></nav>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div id="viewTitle" class="topbar-title">Panel de Control</div>
            <div class="topbar-user">
                <strong th:text="${nombreCompleto}">Usuario</strong>
                <span class="role-pill" th:text="${rolEtiqueta}">Rol</span>
                <button type="button" id="btnAbrirClave" class="btn btn-secondary btn-sm">Cambiar clave</button>
                <button type="button" id="btnLogout" class="btn btn-danger btn-sm">Cerrar sesión</button>
            </div>
        </header>

        <main class="content">
            <div id="globalAlert" class="alert hidden"></div>
            <div id="stockAlertBanner" class="alert alert-warning hidden"></div>
            <section id="moduleContainer"></section>
        </main>
    </div>
</div>

<div id="modalClave" class="modal-backdrop hidden">
    <div class="modal-card">
        <h3 id="modalClaveTitulo" style="margin-top:0;color:var(--navy);">Cambiar Contraseña</h3>
        <p id="modalClaveDesc" style="font-size:13px;color:var(--muted);margin-top:0;">
            Usa mínimo 6 caracteres combinando letras y números.
        </p>
        <div id="claveError" class="alert alert-error hidden"></div>
        <form id="formClave">
            <div class="form-group">
                <label for="claveActual">Contraseña actual</label>
                <input id="claveActual" type="password" required>
            </div>
            <div class="form-group">
                <label for="claveNueva">Nueva contraseña</label>
                <input id="claveNueva" type="password" required minlength="6">
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
                <button type="button" id="btnCancelarClave" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar contraseña</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
