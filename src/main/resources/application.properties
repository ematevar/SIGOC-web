spring.application.name=sigoc-web
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Sesión HTTP y cookies (RNF-06, C13)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Conexión MySQL externalizada por variables de entorno (C01)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA (ddl-auto=none para respetar el esquema SQL explícito)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Pasarela PayPal Sandbox externalizada (RF-20)
sigoc.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
sigoc.paypal.client-id=${PAYPAL_CLIENT_ID:}
sigoc.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
sigoc.paypal.timeout-seconds=${PAYPAL_TIMEOUT_SECONDS:10}
sigoc.pago.enlace-horas-vigencia=${PAGO_ENLACE_HORAS:72}
